<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <title>WarCrafted Launcher</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="launcher-shell">
      <header class="topbar" id="titlebar" data-tauri-drag-region>
        <img class="brand-logo" id="brand-logo" alt="WarCrafted" data-tauri-drag-region />
        <nav class="tab-list" id="tab-list" role="tablist" aria-label="Secciones del launcher">
          <button class="top-tab" id="tab-home" type="button" role="tab" aria-selected="true" aria-controls="panel-home" tabindex="0">INICIO</button>
          <button class="top-tab" id="tab-news" type="button" role="tab" aria-selected="false" aria-controls="panel-news" tabindex="-1">NOTICIAS</button>
          <button class="top-tab" id="tab-addons" type="button" role="tab" aria-selected="false" aria-controls="panel-addons" tabindex="-1">ADDONS</button>
          <button class="top-tab" id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="panel-settings" tabindex="-1">AJUSTES</button>
        </nav>
        <p class="realm-caption" data-tauri-drag-region>IceTracks</p>
        <div class="window-controls" aria-label="Controles de ventana">
          <button class="window-control" id="minimize-button" type="button" aria-label="Minimizar" title="Minimizar">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" /></svg>
          </button>
          <button class="window-control close-control" id="close-button" type="button" aria-label="Cerrar" title="Cerrar">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" /></svg>
          </button>
        </div>
      </header>

      <main class="content-area" id="content-area" aria-label="Contenido del launcher">
        <div id="tab-panels"></div>
      </main>

      <div class="operation-message" id="operation-message" role="status" aria-live="polite" hidden></div>

      <footer class="action-dock" aria-label="Estado y acciones del cliente">
        <div class="action-group">
          <button class="button button-secondary action-button" id="check-button" type="button" disabled>
            <span class="button-spinner" aria-hidden="true" hidden></span>
            <span class="button-label">Comprobar</span>
          </button>
          <button class="button button-secondary action-button" id="update-button" type="button" disabled>
            <span class="button-spinner" aria-hidden="true" hidden></span>
            <span class="button-label">Actualizar</span>
          </button>
        </div>

        <div class="dock-status">
          <div class="summary-copy" id="client-summary" aria-live="polite">
            <span class="status-icon" id="status-icon" aria-hidden="true">○</span>
            <span class="summary-text">
              <span id="status-text">Sin comprobar</span>
              <span class="summary-description" id="summary-description"></span>
            </span>
          </div>
          <div class="progress-area" aria-live="polite">
            <div class="progress-meter" id="progress-meter" hidden>
              <progress id="update-progress" max="1" value="0" aria-label="Progreso del cliente"></progress>
            </div>
            <p class="progress-status" id="progress-status"></p>
          </div>
        </div>
        <button class="button button-secondary cancel-button" id="cancel-button" type="button" hidden>Cancelar</button>
        <button class="button button-play action-button" id="play-button" type="button" disabled>
          <span class="button-spinner" aria-hidden="true" hidden></span>
          <span class="play-icon" aria-hidden="true">▶</span>
          <span class="button-label">JUGAR</span>
        </button>
      </footer>
    </div>
  </body>
</html>
